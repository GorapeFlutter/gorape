services:
  godoc:
    image: golang:1.25
    container_name: gorape-godoc
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    ports:
      - "3003:6060"
    volumes:
      - .:/go/src/github.com/Gorapeflutter/gorape:ro
    working_dir: /go/src/github.com/Gorapeflutter/gorape
    command: ["sh", "-c", "go install golang.org/x/tools/cmd/godoc@latest && godoc -http=:6060"]
    networks:
      - gorape-network

name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: test -z "$(gofmt -l cmd pkg test)"
      - run: go test -race ./...
      - run: go build ./cmd/...
      - run: docker compose --project-directory . -f docker/network.yaml -f docker/postgres.yaml -f docker/redis.yaml -f docker/keycloak.yaml -f docker/server.yaml config

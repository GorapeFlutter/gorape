[book]
authors = ["Ryo ARIMA"]
language = "en"
src = "src"
title = "Gorape Documentation"
description = "Device trust, attestation, and management backend"

[build]
build-dir = "../dist"
create-missing = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Gorapeflutter/gorape"
edit-url-template = "https://github.com/Gorapeflutter/gorape/edit/main/docs/books/{path}"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[book]
authors = ["Ryo Arima"]
language = "ja"
src = "src"
title = "Gorape"
description = "Open Device Trust & Attestation Backend"

[build]
build-dir = "../../_site"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Gorapeflutter/gorape"
edit-url-template = "https://github.com/Gorapeflutter/gorape/edit/main/docs/book/{path}"

[output.html.search]
enable = true
